<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow">
<title>Slam draaiboek </title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0d12;--panel:#17161d;--panel2:#1f1d27;--line:#2c2a36;--ink:#f3f1f7;--mute:#a19daf;--acc:#ff3d7f;--acc2:#ffd23f;--ok:#3ddc97;--warn:#ff9f43;--r:14px}
:root[data-theme=light]{--bg:#f6f4f0;--panel:#fff;--panel2:#f1eee8;--line:#e2ddd3;--ink:#16141c;--mute:#6b6676;--acc:#e0115f;--acc2:#b98900;--ok:#0e9f62;--warn:#c76a00}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.15}
a{color:var(--acc)}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font:800 18px "Bricolage Grotesque";letter-spacing:-.02em}.logo i{color:var(--acc);font-style:normal}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.nav a,.nav button{font:600 13px "JetBrains Mono",monospace;color:var(--ink);text-decoration:none;background:var(--panel2);border:1px solid var(--line);padding:6px 10px;border-radius:999px;cursor:pointer}
.nav a:hover{border-color:var(--acc)}
main{max-width:1080px;margin:0 auto;padding:28px 16px 80px}
.hero{display:grid;gap:6px;margin-bottom:28px}
.hero .dag{font:600 13px "JetBrains Mono";color:var(--acc);text-transform:uppercase;letter-spacing:.12em}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--mute);margin:0;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:36px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.box h3{font-size:15px;margin-bottom:8px;color:var(--acc2);text-transform:uppercase;letter-spacing:.06em}
.box ul{margin:0;padding-left:18px}.box li{margin:6px 0}.box li p{margin:2px 0 0;color:var(--mute);font-size:14px}
.uur{margin-bottom:44px}
.uur-head{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:2px solid var(--acc);margin-bottom:12px;position:sticky;top:52px;background:var(--bg);z-index:3}
.uur-head h2{font:800 34px "Bricolage Grotesque";letter-spacing:-.03em}
.show{color:var(--mute);font-weight:600}
.slot{display:flex;gap:10px;align-items:center;font:600 12px "JetBrains Mono";text-transform:uppercase;letter-spacing:.1em;color:var(--mute);padding:7px 12px;margin:6px 0;border:1px dashed var(--line);border-radius:10px}
.slot em{font-style:normal;text-transform:none;letter-spacing:0;font-family:"IBM Plex Sans";font-weight:400}
.slot-reclame{color:var(--warn)}.slot-nieuws{color:var(--acc)}
.track{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:center;padding:8px 12px;border-radius:10px}
.track:nth-child(odd){background:color-mix(in srgb,var(--panel) 55%,transparent)}
.tnr{font:600 13px "JetBrains Mono";color:var(--mute)}
.tname b{font-weight:600}.sep{color:var(--mute)}
.tmeta{font:500 12px "JetBrains Mono";color:var(--mute)}
.tnote{grid-column:2/4;font-size:13px;color:var(--acc2)}
.break{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:var(--r);padding:16px;margin:12px 0 16px}
.break.isdone{opacity:.45}
.break-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.break-head h3{font-size:20px}
.mic{font-size:18px}
.soort{font:700 11px "JetBrains Mono";text-transform:uppercase;letter-spacing:.1em;padding:4px 8px;border-radius:6px;background:var(--panel2);color:var(--acc2);border:1px solid var(--line)}
.soort-throwback{background:var(--acc2);color:#16141c;border-color:transparent}
.soort-dagopener{background:var(--acc);color:#fff;border-color:transparent}
.done{margin-left:auto;background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
.break.isdone .done{background:var(--ok);color:#000;border-color:var(--ok)}
.rond{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:8px 0 2px}.rond b{color:var(--ink);font:700 11px "JetBrains Mono";text-transform:uppercase;margin-right:4px}
.aanloop{font-size:14px;color:var(--mute);margin-top:6px}.aanloop p{margin:4px 0}
.sugs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-top:12px}
.sug{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
.sug.picked{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2) inset}
.sug header{display:flex;gap:8px;align-items:flex-start}
.sug h4{font-size:16px;flex:1}
.pick{background:none;border:0;color:var(--line);font-size:18px;cursor:pointer;padding:0;line-height:1}
.sug.picked .pick{color:var(--acc2)}
.dur{font:600 12px "JetBrains Mono";padding:2px 7px;border-radius:6px;white-space:nowrap}
.dur.goed{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.dur.kort{color:var(--mute);background:var(--panel)}
.dur.lang{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tekst{font-size:15.5px;margin-top:6px}.tekst p{margin:0 0 8px}
.feitjes{margin:4px 0 8px;padding-left:18px;font-size:14.5px}.feitjes li{margin:3px 0}.feitjes p{margin:0}
.tip{font-size:13.5px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}.tip b{color:var(--acc2);margin-right:4px}.tip p{display:inline;margin:0}
.sug footer{margin-top:auto;padding-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font:600 11px "JetBrains Mono";color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.bron{font-size:12px;color:var(--mute);margin-left:auto}
.hidepicked .sug:not(.picked){display:none}
.hidepicked .break:has(.picked) .sugs{grid-template-columns:1fr}
@media (max-width:640px){.uur-head{top:96px}.sugs{grid-template-columns:1fr}.nav{margin-left:0}}
@media print{.top,.done,.pick{display:none}body{background:#fff;color:#000}.break,.sug,.box{break-inside:avoid;background:#fff;border-color:#ccc}.uur-head{position:static}}
</style></head>
<body data-datum="">
<div class="top"><div class="in"><span class="logo">SLAM<i>/</i>draaiboek</span>
<nav class="nav"><button id="fx">Alleen ★</button><button id="th">◐</button></nav></div></div>
<main>
<div class="hero"><span class="dag">Slam </span><h1>Nog geen draaiboek</h1><p>Zet de playlist van vandaag in de chat bij Claude en het draaiboek verschijnt hier.</p></div>
<div class="grid"></div>

</main>
<script>
const K='slam-db-'+document.body.dataset.datum;
let st={};try{st=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
document.querySelectorAll('.break').forEach(b=>{
  const id=b.id;st[id]=st[id]||{};
  if(st[id].done)b.classList.add('isdone');
  b.querySelectorAll('.sug').forEach(s=>{if(st[id].pick==s.dataset.idx)s.classList.add('picked')});
  b.querySelector('.done').onclick=()=>{st[id].done=!st[id].done;b.classList.toggle('isdone');save()};
  b.querySelectorAll('.pick').forEach(p=>p.onclick=()=>{const s=p.closest('.sug');const on=!s.classList.contains('picked');
    b.querySelectorAll('.sug').forEach(x=>x.classList.remove('picked'));if(on){s.classList.add('picked');st[id].pick=s.dataset.idx}else delete st[id].pick;save()});
});
document.getElementById('fx').onclick=e=>{document.body.classList.toggle('hidepicked');e.target.textContent=document.body.classList.contains('hidepicked')?'Toon alles':'Alleen ★'};
document.getElementById('th').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('slam-theme',r.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem('slam-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
</script>
</body></html>
